version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fileflow-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - EMAIL_HOST=${EMAIL_HOST:-imap.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-993}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-true}
      - EMAIL_FOLDER=${EMAIL_FOLDER:-INBOX}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./storage/email_manager.db}
      - STORAGE_PATH=/app/backend/storage
      - AUTO_POLL_ENABLED=${AUTO_POLL_ENABLED:-false}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-120}
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: fileflow-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
